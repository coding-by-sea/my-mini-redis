[package]
name = "my-redis"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
anyhow = "1"
atoi = "3"
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "my-mini-redis-cli"
path = "src/bin/client.rs"

[[bin]]
name = "my-mini-redis-server"
path = "src/bin/server.rs"

[[bench]]
name = "load"
harness = false
